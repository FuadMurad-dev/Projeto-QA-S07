version: '3'
services:
  app:
    build:
      context: ../whather-now # pasta onde fica o app do meu amigo
      dockerfile: dockerfile.app
    container_name: WhatherNow
    environment:
      - OPENWEATHER_API_KEY=${7ec2be6f924e816560bda0361f8affe1}
      - HOST=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "q0-", "http://localhost:3000"]
      interval: 5s
      timeout: 30s
      retries: 5
  cypress:
    build:
      context: ..
      dockerfile: dockerfile.cypress
    container_name: Cypress
    depends_on:
      - app
    environment:
      - CYPRESS_baseUrl=http://app:3000
      - CYPRESS_API_KEY=${7ec2be6f924e816560bda0361f8affe1}
    volumes:
      - ./cypress:/e2e/cypress
      - ./cypress.json:/e2e/cypress.json