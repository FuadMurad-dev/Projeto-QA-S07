services:
  app:
    build:
      context: ../weather-now            # pasta do projeto do seu amigo
      dockerfile: ../Projeto-QA-S07/dockerfile.app   # caminho do Dockerfile.app relativo ao context
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  cypress:
    build:
      context: .
      dockerfile: dockerfile.cypress
    profiles: ["test"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CYPRESS_baseUrl=http://app:3000
      - CYPRESS_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./cypress/reports:/e2e/cypress/reports
      - ./cypress/screenshots:/e2e/cypress/screenshots
      - ./cypress/videos:/e2e/cypress/videos

  jenkins:
    build:
      context: .
      dockerfile: dockerfile.jenkins
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    
  reports:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./cypress/reports:/usr/share/nginx/html:ro

volumes:
  jenkins_home: