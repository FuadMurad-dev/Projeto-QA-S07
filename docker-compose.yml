services:
  app:
    build:
      context: ../weather-now            # pasta do projeto do seu amigo
      dockerfile: ../Projeto-QA-S07/dockerfile.app   # caminho do Dockerfile.app relativo ao context
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  cypress:
    build:
      context: .
      dockerfile: dockerfile.cypress
    profiles: ["test"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CYPRESS_baseUrl=http://app:3000
      - CYPRESS_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - allure-results:/e2e/allure-results
      - ./cypress/screenshots:/e2e/cypress/screenshots
      - ./cypress/videos:/e2e/cypress/videos

  jenkins:
    build:
      context: .
      dockerfile: dockerfile.jenkins
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  # Allure: recebe os resultados do Cypress e gera o relatório com histórico
  allure:
    image: frankescobar/allure-docker-service:2.27.0
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=NONE   # relatório gerado sob demanda (Jenkins chama a API)
      - KEEP_HISTORY=1
      - KEEP_HISTORY_LATEST=20
    ports:
      - "5050:5050"
    volumes:
      - allure-results:/app/allure-results
      - allure-reports:/app/default-reports

  # Portainer: interface web para gerenciar os containers
  portainer:
    image: portainer/portainer-ce:2.21.5
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  jenkins_home:
  portainer_data:
  allure-reports:
  allure-results:
    name: allure-results   # nome fixo para o Jenkins usar no "docker run -v"
